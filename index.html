<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏数学乐园 · 北师大版四年级</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#e8f4fd 0%,#eef7ee 50%,#fdf6ec 100%);
    min-height:100vh; color:#333;
    display:flex; flex-direction:column; align-items:center;
    padding:30px 16px 60px;
  }
  h1 { font-size:32px; color:#2b6cb0; margin-bottom:6px; }
  .subtitle { color:#8a97a8; font-size:14px; margin-bottom:30px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px; width:100%; max-width:720px; }
  .card {
    display:block; text-decoration:none; border-radius:20px; padding:26px 20px;
    color:#fff; transition:transform .15s, box-shadow .15s; position:relative; overflow:hidden;
  }
  .card:hover { transform:translateY(-5px); box-shadow:0 12px 28px rgba(0,0,0,.18); }
  .card .icon { font-size:44px; }
  .card h2 { font-size:21px; margin:10px 0 6px; }
  .card p { font-size:13px; opacity:.92; line-height:1.6; }
  .card .unit { display:inline-block; background:rgba(255,255,255,.22); border-radius:10px; padding:3px 10px; font-size:12px; margin-bottom:8px; }
  .card.angle { background:linear-gradient(135deg,#4a90d9,#2b6cb0); }
  .card.number { background:linear-gradient(135deg,#43cea2,#1d7a4a); }
  .card.next { background:rgba(255,255,255,.55); color:#8a97a8; border:2px dashed #c3cfdd; cursor:default; }
  .card.next:hover { transform:none; box-shadow:none; }
  .footer { margin-top:36px; color:#a8b4c4; font-size:12px; text-align:center; line-height:1.8; }
</style>
</head>
<body>
  <h1>🎮 游戏数学乐园</h1>
  <div class="subtitle">北师大版 · 四年级数学 · 玩中学</div>
  <div class="grid">
    <a class="card angle" href="./angle-explorer.html">
      <span class="unit">第二单元 · 线与角</span><br>
      <span class="icon">📐</span>
      <h2>角度探险家</h2>
      <p>7 个关卡：识角 · 估角 · 量角 · 画角<br>折叠三大类（直角/平角/周角）· 常考题10种 · 错题本</p>
    </a>
    <a class="card number" href="./number-explorer.html">
      <span class="unit">第一单元 · 认识更大的数</span><br>
      <span class="icon">🔢</span>
      <h2>大数探险家</h2>
      <p>7 个关卡：数位 · 分级读数 · 写数 · 比大小<br>四舍五入 · 改写vs近似 · 概念快答 · 错题本</p>
    </a>
    <div class="card next">
      <span class="icon">🚧</span>
      <h2>更多游戏</h2>
      <p>第三单元 &gt; 乘法 ……<br>制作中，敬请期待</p>
    </div>
  </div>
  <div class="footer">
    每个游戏的错题本存在各自设备的浏览器里<br>
    建议收藏本页 📌
  </div>
</body>
</html>
